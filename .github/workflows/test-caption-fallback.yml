name: Test Caption Fallback

on:
  push:
    paths:
      - "src/build_caption.py"
      - "src/render_reel.py"
      - ".github/workflows/test-caption-fallback.yml"
      - ".github/workflows/reels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-caption-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test caption generation without lyrics
        run: |
          python - <<'PY'
          from src.build_caption import build_caption

          caption = build_caption("Blinding Lights", "The Weeknd")
          assert "Blinding Lights" in caption
          assert "The Weeknd" in caption
          assert "fresh sound" in caption
          assert "#iPhoneRingtone" in caption
          assert "#Ringtone" in caption
          assert len(caption) < 2200
          print("PASS: caption works without lyrics and includes track metadata, original hook, and SEO tags.")

          with_excerpt = build_caption("Blinding Lights", "The Weeknd", "Short approved excerpt")
          assert "Short approved excerpt" in with_excerpt
          print("PASS: optional approved excerpt can still be supplied explicitly.")
          PY
      - name: Install FFmpeg for rendering test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test 9:16 video rendering with dynamic track overlay
        run: |
          python - <<'PY'
          from PIL import Image
          Image.new("RGB", (360, 640), (8, 12, 38)).save("test-template.png")
          PY
          python src/render_reel.py --title "Test Song" --artist "Test Artist" --duration 3 --template test-template.png --output output/test-reel.mp4
          test -s output/test-reel.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/test-reel.mp4 | grep -qx '1080x1920'
          echo "PASS: generated a 1080x1920 MP4 with dynamic title/artist overlay."
