name: Test Reel Builder

on:
  push:
    paths:
      - "src/build_caption.py"
      - "src/render_reel.py"
      - "requirements.txt"
      - "config/settings.json"
      - ".github/workflows/test-caption-fallback.yml"
      - ".github/workflows/reels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-reel-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active Python scripts
        run: python -m py_compile src/build_caption.py src/render_reel.py
      - name: Test caption metadata and hashtags
        run: |
          python - <<'PY'
          from src.build_caption import build_caption
          caption = build_caption("Blinding Lights", "The Weeknd")
          assert "Blinding Lights" in caption
          assert "The Weeknd" in caption
          assert "#iPhoneRingtone" in caption
          assert "#Ringtone" in caption
          assert len(caption) < 2200
          print("PASS: caption includes track metadata and SEO hashtags.")
          PY
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render and validate 9:16 Reel
        run: |
          mkdir -p output
          python - <<'PY'
          from PIL import Image
          Image.new("RGB", (360, 640), (8, 12, 38)).save("test-template.png")
          PY
          python src/render_reel.py --title "Test Song" --artist "Test Artist" --duration 3 --template test-template.png --output output/test-reel.mp4
          test -s output/test-reel.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/test-reel.mp4 | grep -qx '1080x1920'
          echo "PASS: MP4 render is valid 1080x1920."
