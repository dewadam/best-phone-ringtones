name: Best Phone Ringtones Reels

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: best-phone-ringtones-publisher
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      META_AUDIO_TYPE: ${{ vars.META_AUDIO_TYPE || 'music' }}
      PUBLIC_VIDEO_URL: ${{ vars.PUBLIC_VIDEO_URL }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      REEL_CAPTION: ${{ vars.REEL_CAPTION }}
      LYRIC_EXCERPT: ${{ vars.LYRIC_EXCERPT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check configuration
        run: |
          python - <<'PY'
          import os
          print("DRY_RUN =", os.getenv("DRY_RUN", "true"))
          for name in ("IG_USER_ID", "IG_ACCESS_TOKEN", "META_GRAPH_VERSION", "PUBLIC_VIDEO_URL"):
              print(f"{name} configured =", bool(os.getenv(name)))
          PY
      - name: Discover trending audio from Meta
        run: |
          python src/audio_provider.py > selected_audio.json
          python - <<'PY'
          import json, os
          with open("selected_audio.json", encoding="utf-8") as f:
              track = json.load(f)
          # Values are returned by Meta's API; don't accept a manually invented audio ID.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in (
                  ("META_AUDIO_ID", track["audio_id"]),
                  ("SONG_TITLE", track.get("title", "")),
                  ("ARTIST_NAME", track.get("artist", "")),
              ):
                  value = str(value or "")
                  if "\n" in value or "\r" in value:
                      raise ValueError(f"Unexpected newline in Meta field: {key}")
                  env.write(f"{key}={value}\n")
          print("Selected Meta audio:", track.get("title") or "(title not supplied)",
                "—", track.get("artist") or "(artist not supplied)")
          PY
      - name: Build emoji caption and SEO hashtags (lyrics optional)
        run: |
          if [ -n "$SONG_TITLE" ] && [ -n "$ARTIST_NAME" ]; then
            {
              echo "REEL_CAPTION<<CAPTION_EOF"
              python src/build_caption.py
              echo "CAPTION_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "Meta did not return both title and artist; using configured REEL_CAPTION fallback."
          fi
      - name: Render branded 9:16 Reel
        run: |
          TITLE="${SONG_TITLE:-Best Phone Ringtones}"
          ARTIST="${ARTIST_NAME:-Trending Audio}"
          python src/render_reel.py --title "$TITLE" --artist "$ARTIST" --duration 15 --output output/best-phone-ringtones-reel.mp4
      - name: Upload rendered Reel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-phone-ringtones-reel
          path: output/best-phone-ringtones-reel.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Publishing status
        run: |
          echo "Reel rendered and saved as a downloadable Actions artifact."
          echo "Automatic Instagram publishing is intentionally paused until the generated MP4 is hosted at a public HTTPS URL."
          echo "PUBLIC_VIDEO_URL is not used here because it could point to a stale or unrelated video."
