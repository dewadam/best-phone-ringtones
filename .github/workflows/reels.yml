name: Best Phone Ringtones Reel Builder

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: "Song title shown on screen (empty/RANDOM = from file name)"
        required: true
        default: "RANDOM"
        type: string
      artist_name:
        description: "Artist name"
        required: true
        default: "RANDOM"
        type: string
      category:
        description: "Song category for the instagram catalog: any / turkish / foreign (scheduled runs set it automatically)"
        required: true
        default: "any"
        type: choice
        options:
          - any
          - turkish
          - foreign
      audio_source:
        description: "instagram = attach song from Instagram catalog via API; file = mix your own MP3 from assets/audio into the video"
        required: true
        default: "instagram"
        type: choice
        options:
          - instagram
          - file
      lyric_excerpt:
        description: "Optional lyric line for the caption (max 90 chars; only text you are allowed to use)"
        required: false
        default: ""
        type: string
      fetch_lyrics:
        description: "Try to auto-fetch a short lyric excerpt (best effort, may fail; see README)"
        required: false
        default: false
        type: boolean
      audio_file:
        description: "(file mode) Audio file in repo, e.g. assets/audio/Artist - Title.mp3 (empty = random file from assets/audio)"
        required: false
        default: ""
        type: string
      audio_start:
        description: "Start second inside the audio file (e.g. 45 to skip the intro)"
        required: false
        default: "0"
        type: string
      duration:
        description: "Reel duration in seconds (3-29, hard maximum 29)"
        required: true
        default: "29"
        type: string
      publish_now:
        description: "Publish to Instagram (requires configured repository secrets)"
        required: true
        default: false
        type: boolean
  schedule:
    # 30 runs per day = 15 Turkish + 15 foreign songs, 08:07-22:37 Istanbul time (05:00-19:59 UTC)
    - cron: "7 5-19 * * *"    # :07 -> Turkish song
    - cron: "37 5-19 * * *"   # :37 -> foreign song

permissions:
  contents: write   # needed to stage the MP4 on a temporary branch (public video_url for Instagram)

concurrency:
  group: best-phone-ringtones-reel-builder
  cancel-in-progress: false

jobs:
  build-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Choose Reel metadata
        env:
          INPUT_TITLE: ${{ inputs.song_title }}
          INPUT_ARTIST: ${{ inputs.artist_name }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_AUDIO_SOURCE: ${{ inputs.audio_source }}
          INPUT_CATEGORY: ${{ inputs.category }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_AUDIO_FILE: ${{ inputs.audio_file }}
          INPUT_AUDIO_START: ${{ inputs.audio_start }}
          INPUT_PUBLISH_NOW: ${{ inputs.publish_now }}
          EVENT_NAME: ${{ github.event_name }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: |
          # Scheduled (daily) runs publish automatically unless repo variable AUTO_PUBLISH is set to "false".
          # Manual runs publish only when the publish_now box is ticked.
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$AUTO_PUBLISH" = "false" ]; then PUBLISH=false; else PUBLISH=true; fi
          else
            PUBLISH="$INPUT_PUBLISH_NOW"
          fi
          # Which category? Scheduled runs: the cron entry decides (minute 07 = Turkish, minute 37 = foreign).
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "7 5-19 * * *") CATEGORY=turkish ;;
              *)              CATEGORY=foreign ;;
            esac
          else
            CATEGORY="${INPUT_CATEGORY:-any}"
          fi
          TITLE="${INPUT_TITLE:-RANDOM}"
          ARTIST="${INPUT_ARTIST:-RANDOM}"
          if [ "$TITLE" = "RANDOM" ]; then TITLE=""; fi
          if [ "$ARTIST" = "RANDOM" ]; then ARTIST=""; fi
          DURATION="${INPUT_DURATION:-29}"
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || [ "$DURATION" -lt 3 ] || [ "$DURATION" -gt 29 ]; then
            echo "::error::Duration must be an integer between 3 and 29 seconds (Reels are capped at 29 s)."
            exit 1
          fi
          {
            echo "SONG_TITLE=$TITLE"
            echo "ARTIST_NAME=$ARTIST"
            echo "REEL_DURATION=$DURATION"
            echo "AUDIO_SOURCE=${INPUT_AUDIO_SOURCE:-instagram}"
            echo "AUDIO_FILE=$INPUT_AUDIO_FILE"
            echo "AUDIO_START=${INPUT_AUDIO_START:-0}"
            echo "PUBLISH_NOW=$PUBLISH"
            echo "CATEGORY=$CATEGORY"
          } >> "$GITHUB_ENV"

      - name: Select Instagram catalog audio
        if: ${{ inputs.audio_source != 'file' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
        run: python src/select_trending_audio.py

      - name: Pick soundtrack from assets/audio
        if: ${{ inputs.audio_source == 'file' }}
        run: python src/pick_audio.py

      - name: Build caption and hashtags
        env:
          INPUT_LYRIC: ${{ inputs.lyric_excerpt }}
          FETCH_LYRICS: ${{ inputs.fetch_lyrics }}
        run: |
          LYRIC_EXCERPT="$INPUT_LYRIC"
          if [ -z "$LYRIC_EXCERPT" ] && [ "$FETCH_LYRICS" = "true" ]; then
            LYRIC_EXCERPT=$(python src/lyrics_scraper.py "$SONG_TITLE" "$ARTIST_NAME" 2>lyrics.err || true)
            cat lyrics.err || true
            [ -z "$LYRIC_EXCERPT" ] && echo "No lyric excerpt fetched; using the default hook."
          fi
          export LYRIC_EXCERPT
          python src/build_caption.py > output_caption.txt
          cat output_caption.txt
          {
            echo "REEL_CAPTION<<CAPTION_EOF"
            cat output_caption.txt
            echo "CAPTION_EOF"
          } >> "$GITHUB_ENV"

      - name: Render Reel visual
        run: |
          mkdir -p output
          AUDIO_ARGS=()
          if [ "$AUDIO_SOURCE" = "file" ]; then AUDIO_ARGS=(--audio "$AUDIO_PATH" --audio-start "$AUDIO_START"); else AUDIO_ARGS=(--no-audio); fi
          if [ -f assets/template-reel.mp4 ]; then
            python src/render_template_video.py \
              --input assets/template-reel.mp4 \
              --title "$SONG_TITLE" \
              --artist "$ARTIST_NAME" \
              --duration "$REEL_DURATION" \
              "${AUDIO_ARGS[@]}" \
              --output output/best-phone-ringtones-reel.mp4
          else
            echo "::error::Template video missing: upload your MP4 to assets/template-reel.mp4 before running."
            exit 1
          fi

      - name: Validate generated video
        run: |
          test -s output/best-phone-ringtones-reel.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 output/best-phone-ringtones-reel.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 output/best-phone-ringtones-reel.mp4
          LEN=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/best-phone-ringtones-reel.mp4)
          echo "Reel length: ${LEN}s (max 29s)"
          awk -v d="$LEN" 'BEGIN{exit !(d <= 29.05)}' || { echo "::error::Reel is longer than 29 seconds ($LEN s)"; exit 1; }
          if [ "$AUDIO_SOURCE" = "file" ]; then
            # Fail the run if the Reel has no audible sound
            test -n "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 output/best-phone-ringtones-reel.mp4)" \
              || { echo "::error::Rendered video has no audio stream"; exit 1; }
            MEAN=$(ffmpeg -hide_banner -i output/best-phone-ringtones-reel.mp4 -vn -af volumedetect -f null - 2>&1 | sed -n 's/.*mean_volume: \(-\?[0-9.]*\) dB.*/\1/p')
            echo "Mean volume: ${MEAN} dB"
            awk -v m="$MEAN" 'BEGIN{exit !(m > -60)}' || { echo "::error::Audio is silent"; exit 1; }
          fi

      - name: Stage video at a public URL (temporary branch)
        if: ${{ env.PUBLISH_NOW == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NAME="reel-${GITHUB_RUN_ID}.mp4"
          STAGE=$(mktemp -d)
          cp output/best-phone-ringtones-reel.mp4 "$STAGE/$NAME"
          cd "$STAGE"
          git init -q -b reel-staging
          git add "$NAME"
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -qm "stage reel $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" reel-staging
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/reel-staging/${NAME}"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || true)
            echo "Check $i: HTTP $CODE ($URL)"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Video URL is not publicly reachable (HTTP $CODE). The repository must be PUBLIC for Instagram to download it."
            exit 1
          fi
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"

      - name: Publish Reel
        if: ${{ env.PUBLISH_NOW == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
          SONG_TITLE: ${{ env.SONG_TITLE }}
          ARTIST_NAME: ${{ env.ARTIST_NAME }}
          REEL_CAPTION: ${{ env.REEL_CAPTION }}
          IG_AUDIO_ID: ${{ env.IG_AUDIO_ID }}
          AUDIO_SOURCE: ${{ env.AUDIO_SOURCE }}
          AUDIO_PATH: ${{ env.AUDIO_PATH }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
          VIDEO_PATH: output/best-phone-ringtones-reel.mp4
          INSTAGRAM_PUBLISH: "true"
        run: python src/instagram_publish.py

      - name: Save used-audio history (commit to repo)
        if: ${{ success() && env.PUBLISH_NOW == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/used_audio.json
          if git diff --cached --quiet; then echo "No history change."; exit 0; fi
          git commit -m "Record posted audio [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::error::Could not push data/used_audio.json; the song may repeat."
          exit 1

      - name: Remove staging branch
        if: ${{ always() && env.PUBLISH_NOW == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete reel-staging || true

      - name: Save Reel and caption as workflow artifacts
        if: ${{ env.PUBLISH_NOW != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: best-phone-ringtones-reel
          path: |
            output/best-phone-ringtones-reel.mp4
            output_caption.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          echo "Video generation completed."
          if [ "$PUBLISH_NOW" = "true" ]; then
            echo "Instagram publish was requested. Check the preceding step for API result."
          else
            echo "Preview-only run: no Instagram post was made."
          fi
