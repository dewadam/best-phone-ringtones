name: Best Phone Ringtones Reel Builder

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: "Music title to show on the Reel"
        required: true
        default: "Song Title"
        type: string
      artist_name:
        description: "Artist name to show on the Reel"
        required: true
        default: "Artist Name"
        type: string
      duration:
        description: "Reel duration in seconds (3-90)"
        required: true
        default: "15"
        type: string
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: best-phone-ringtones-reel-builder
  cancel-in-progress: false

jobs:
  build-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Choose Reel metadata
        env:
          INPUT_TITLE: ${{ inputs.song_title }}
          INPUT_ARTIST: ${{ inputs.artist_name }}
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          TITLE="${INPUT_TITLE:-Song Title}"
          ARTIST="${INPUT_ARTIST:-Artist Name}"
          DURATION="${INPUT_DURATION:-15}"
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || [ "$DURATION" -lt 3 ] || [ "$DURATION" -gt 90 ]; then
            echo "::error::Duration must be an integer between 3 and 90 seconds."
            exit 1
          fi
          {
            echo "SONG_TITLE=$TITLE"
            echo "ARTIST_NAME=$ARTIST"
            echo "REEL_DURATION=$DURATION"
          } >> "$GITHUB_ENV"

      - name: Build caption and hashtags
        run: |
          python src/build_caption.py > output_caption.txt
          cat output_caption.txt
          {
            echo "REEL_CAPTION<<CAPTION_EOF"
            cat output_caption.txt
            echo "CAPTION_EOF"
          } >> "$GITHUB_ENV"

      - name: Render the fixed 9:16 Reel visual
        run: |
          mkdir -p output
          python src/render_reel.py \
            --title "$SONG_TITLE" \
            --artist "$ARTIST_NAME" \
            --duration "$REEL_DURATION" \
            --output output/best-phone-ringtones-reel.mp4

      - name: Validate generated video
        run: |
          test -s output/best-phone-ringtones-reel.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 output/best-phone-ringtones-reel.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 output/best-phone-ringtones-reel.mp4

      - name: Save Reel and caption as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: best-phone-ringtones-reel
          path: |
            output/best-phone-ringtones-reel.mp4
            output_caption.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          echo "Reel generation is complete when the artifact step succeeds."
          echo "Instagram API publishing and Instagram music selection are intentionally not implemented yet."
          echo "The MP4 is a silent visual; the Instagram integration will need to attach/select catalog audio when supported by the authorized account/API."
