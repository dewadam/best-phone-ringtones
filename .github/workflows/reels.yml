name: Best Phone Ringtones Reels

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: best-phone-ringtones-publisher
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      PUBLIC_VIDEO_URL: ${{ vars.PUBLIC_VIDEO_URL }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      META_AUDIO_ID: ${{ vars.META_AUDIO_ID }}
      REEL_CAPTION: ${{ vars.REEL_CAPTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check configuration
        run: |
          python - <<'PY'
          import os
          print("DRY_RUN =", os.getenv("DRY_RUN", "true"))
          for name in ("IG_USER_ID", "IG_ACCESS_TOKEN", "META_GRAPH_VERSION", "PUBLIC_VIDEO_URL", "META_AUDIO_ID"):
              print(f"{name} configured =", bool(os.getenv(name)))
          PY
      - name: Guarded publish call
        run: python src/instagram_publish.py
